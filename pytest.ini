[pytest]
pythonpath = . scripts tools
testpaths = tests
addopts = -q
markers =
    db: needs the PostgreSQL and PostGIS container (always run; a missing database fails the test, it never skips)
    class_table: a generated table test (its docstring or its module docstring holds `CLASS-TABLE:`); set by tests/conftest.py
    corpus: a replay of a review corpus (tests/test_corpus.py); set by tests/conftest.py
