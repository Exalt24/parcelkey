name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARCELKEY_ADMIN_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      PARCELKEY_OWNER_PASSWORD: ci-owner-${{ github.run_id }}-${{ github.run_attempt }}
      PARCELKEY_APP_PASSWORD: ci-app-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: parcelkey
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parcelkey"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Wait until Postgres answers a query
        run: python tools/wait_for_pg.py
      - name: Test
        run: python -m pytest -q
